name: React Native Android - Build & Sign APK

on:
  push:
    branches: [dev] # 根据你的主分支调整
    tags:
      - "v*" # v 开头的 tag 触发发布
  pull_request:
    branches: [dev]
  workflow_dispatch: # 允许手动触发测试

permissions:
  contents: write # 必须！允许创建 Release 和上传 assets
  actions: write # 可选，但有助于 workflow 相关操作

jobs:
  build:
    if: github.repository == 'djatm007/joplin-fork'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史用于 changelog 或版本计算

      - name: Install Linux dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libsecret-1-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "20"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Yarn install
        run: yarn install
        env:
          SKIP_ONENOTE_CONVERTER_BUILD: 1

      - name: Free disk space (optional)
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

      - name: Build Android Release (unsigned)
        run: |
          cd packages/app-mobile/android
          sed -i -- 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
          ./gradlew assembleRelease

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2
        with:
          releaseDirectory: packages/app-mobile/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Zipalign signed APK
        run: |
          cd packages/app-mobile/android/app
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/"
          ZIPALIGN_PATH="$(find "$BUILD_TOOLS_PATH" -name "zipalign" -print | sort | tail -n1)"
          "$ZIPALIGN_PATH" -v -p 4 "${{ steps.sign.outputs.signedReleaseFile }}" app-release-aligned.apk

      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-android-signed-apk
          path: packages/app-mobile/android/app/app-release-aligned.apk
          if-no-files-found: error
          retention-days: 7

      # ────────────── 只有 push tag 时才创建 Release ──────────────
      - name: Create GitHub Release & Upload APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/app-mobile/android/app/app-release-aligned.apk
          tag_name: ${{ github.ref_name }}
          name: Joplin-Fork Android ${{ github.ref_name }}
          body: |
            Auto-built signed APK for ${{ github.ref_name }}

            - Commit: ${{ github.sha }}
            - Built by GitHub Actions
            - SHA256: $(sha256sum packages/app-mobile/android/app/app-release-aligned.apk | cut -d' ' -f1)
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
